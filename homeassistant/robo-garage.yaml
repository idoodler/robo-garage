blueprint:
  name: Robo-Garage
  description: >
    Runs the Robo-Garage (ESPHome) together with the robot vacuum that parks in it.


    * The robot leaves the dock or starts returning → the door opens. If it is not open
    in time, the robot is paused and you get a message.

    * The robot has been back in the dock for a while and its job is over → the door closes. A blocked light barrier
    makes the controller open the door again; the blueprint waits for a clear beam and tries again.

    * Clean button: robot in the dock → open the door, then start cleaning. Robot out → send it home
    (or pause it, or do nothing).

    * Clean button ring lights up while the robot is parked.

    * Messages for a water leak, beam fault, motor fault, stall, low supply and robot errors.

    * iOS Live Activities (optional): one for the cleaning job (a bar per room, current room + %,
    phase, door opening / closing, then done / stopped / error) and one red alert that lists every
    active problem of the robot, its station and the garage. Made for the Dreame integration.

    * Rear fan: dries the cabinet after the robot is parked (speed + time), then hands the fan back to "Vent auto".

    * After a restart of Home Assistant or the controller, the door is put back where it belongs.


    The door firmware still does the safety work on its own (beam stop, stall stop, leak valve).
  domain: automation
  author: idoodler
  source_url: https://github.com/idoodler/robo-garage/blob/main/homeassistant/robo-garage.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    devices:
      name: Devices
      icon: mdi:garage-variant
      input:
        vacuum:
          name: Robot vacuum
          selector:
            entity:
              domain: vacuum
        door:
          name: Robo-Garage door
          description: The door cover of the controller ("Robo-Garage Door").
          selector:
            entity:
              domain: cover
              integration: esphome
        beam:
          name: Door beam
          description: Light barrier ("Door beam"), on = something in the door opening.
          selector:
            entity:
              domain: binary_sensor
              integration: esphome
        clean_button:
          name: Clean button
          selector:
            entity:
              domain: binary_sensor
              integration: esphome
        button_ring:
          name: Clean button ring
          selector:
            entity:
              domain: light
              integration: esphome
        drawer:
          name: Drawer
          description: Drawer reed ("Drawer"), on = drawer out. Only used when "Keep the door open while the drawer is out" is on.
          selector:
            entity:
              domain: binary_sensor
              integration: esphome
        motor_fault:
          name: Door motor fault
          description: >
            "Door motor fault": on = the door was driven but drew no current. The cover then still reads
            "open", so this counts as "the door did not open" (robot paused, no start).
          selector:
            entity:
              domain: binary_sensor
              integration: esphome
        problem_sensors:
          name: Sensors to report
          description: >
            Each one sends a message when it turns on. Pick "Water leak", "Door beam fault",
            "Door motor fault", "Door stall" and "Supply voltage low".
          selector:
            entity:
              domain: binary_sensor
              multiple: true
    door_settings:
      name: Door
      icon: mdi:door-sliding
      input:
        close_delay:
          name: Close after docking
          description: How long the robot must stay in the dock before the door closes.
          default: {minutes: 1}
          selector:
            duration: {}
        open_timeout:
          name: Opening time limit
          description: The door must be open within this time (beeps + "Open time" + margin), else the robot is paused.
          default: 20
          selector:
            number: {min: 5, max: 180, unit_of_measurement: s, mode: box}
        close_timeout:
          name: Closing time limit
          description: The door must be closed within this time (beeps + beam test + "Close time" + margin).
          default: 25
          selector:
            number: {min: 5, max: 180, unit_of_measurement: s, mode: box}
        close_tries:
          name: Close attempts
          description: How often to try closing when the beam was blocked, before giving up with a message.
          default: 3
          selector:
            number: {min: 1, max: 10, mode: box}
        retry_delay:
          name: Wait between attempts
          description: The beam must be clear this long before the next close attempt.
          default: 30
          selector:
            number: {min: 5, max: 600, unit_of_measurement: s, mode: box}
        respect_drawer:
          name: Keep the door open while the drawer is out
          description: Off when no drawer reed is fitted (the input then reads "out" all the time).
          default: false
          selector:
            boolean: {}
        close_while_out:
          name: Close the door while the robot is out
          description: >
            Closes the garage while the robot cleans and opens it again when the robot starts returning.
            Only if the robot reports "returning" early enough for the door to open in time.
          default: false
          selector:
            boolean: {}
        out_close_delay:
          name: Close after the robot left
          description: Used with "Close the door while the robot is out". Time from "cleaning" until the door closes.
          default: {minutes: 2}
          selector:
            duration: {}
    button_settings:
      name: Clean button and ring
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_starts:
          name: Button starts cleaning
          description: Robot in the dock → open the door, then start the robot.
          default: true
          selector:
            boolean: {}
        button_while_out:
          name: Button while the robot is out
          default: return
          selector:
            select:
              options:
                - {label: Send it home, value: return}
                - {label: Pause it, value: pause}
                - {label: Nothing, value: nothing}
        ring_brightness:
          name: Ring brightness while parked
          description: 0 = ring always off.
          default: 30
          selector:
            number: {min: 0, max: 100, unit_of_measurement: "%", mode: slider}
    fan_settings:
      name: Rear fan
      icon: mdi:fan
      collapsed: true
      input:
        rear_fan:
          name: Rear fan
          selector:
            entity:
              domain: fan
              integration: esphome
        vent_auto:
          name: Vent auto switch
          description: Switched on again after drying, so the firmware controls the fan from the SHT41 again.
          selector:
            entity:
              domain: switch
              integration: esphome
        dry_speed:
          name: Drying speed
          description: Fan speed after the robot is parked and the door closed (wet mop, warm station). 0 = no drying run.
          default: 60
          selector:
            number: {min: 0, max: 100, step: 10, unit_of_measurement: "%", mode: slider}
        dry_minutes:
          name: Drying time
          description: Then "Vent auto" takes over again. Stops early when the robot leaves the dock or you switch "Vent auto" on.
          default: 60
          selector:
            number: {min: 5, max: 480, step: 5, unit_of_measurement: min, mode: box}
    live_settings:
      name: Live Activities (iOS)
      icon: mdi:cellphone-text
      collapsed: true
      input:
        live_devices:
          name: Phones
          description: >
            Companion-app devices that get the Live Activities (cleaning job + door, problems).
            Empty = no Live Activities.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true
        la_language:
          name: Language
          default: en
          selector:
            select:
              options:
                - {label: English, value: en}
                - {label: Deutsch, value: de}
        vac_task_status:
          name: Robot task status
          description: Dreame "Task status" sensor (completed = no job).
          selector:
            entity:
              domain: sensor
        vac_status:
          name: Robot status
          description: Dreame "Status" sensor (cleaning, sleeping, ...).
          selector:
            entity:
              domain: sensor
        vac_state:
          name: Robot state
          description: Dreame "State" sensor (washing, returning, charging, ...).
          selector:
            entity:
              domain: sensor
        vac_current_room:
          name: Robot current room
          description: Dreame "Current room" sensor (attribute room_id).
          selector:
            entity:
              domain: sensor
        vac_progress:
          name: Robot cleaning progress
          selector:
            entity:
              domain: sensor
        vac_rooms_helper:
          name: Visited rooms helper
          description: Text helper (max 100 or more) that keeps "planned;visited" room ids during a job.
          selector:
            entity:
              domain: input_text
        vac_error:
          name: Robot error
          description: Dreame "Error" sensor (no_error = OK).
          selector:
            entity:
              domain: sensor
        vac_low_water:
          name: Robot low water warning
          selector:
            entity:
              domain: sensor
        vac_station:
          name: Station status sensors
          description: Dust bag, dirty / clean water tank, detergent (installed = OK).
          selector:
            entity:
              domain: sensor
              multiple: true
        vac_leak:
          name: Robot leak sensors
          description: Extra leak sensors shown in the problem Live Activity (no push from the blueprint).
          default: []
          selector:
            entity:
              domain: binary_sensor
              multiple: true
        problem_flag:
          name: Problem Live Activity helper
          description: Toggle helper, on while the problem Live Activity is shown (for the "solved" message).
          selector:
            entity:
              domain: input_boolean
    notify_settings:
      name: Messages
      icon: mdi:message-alert
      collapsed: true
      input:
        notify_targets:
          name: Notify
          description: Notify entities (e.g. your phone). Empty = a notification in Home Assistant.
          default: []
          selector:
            entity:
              domain: notify
              multiple: true
        notify_title:
          name: Title
          default: Robo-Garage
          selector:
            text: {}

mode: parallel
max: 20
max_exceeded: silent

variables:
  vacuum: !input vacuum
  door: !input door
  beam: !input beam
  motor_fault: !input motor_fault
  open_timeout: !input open_timeout
  close_timeout: !input close_timeout
  close_tries: !input close_tries
  retry_delay: !input retry_delay
  button_starts: !input button_starts
  button_while_out: !input button_while_out
  ring_brightness: !input ring_brightness
  notify_targets: !input notify_targets
  notify_title: !input notify_title
  problem_sensors: !input problem_sensors
  dry_speed: !input dry_speed
  dry_minutes: !input dry_minutes
  live_devices: !input live_devices
  la_lang: !input la_language
  t_task: !input vac_task_status
  t_status: !input vac_status
  t_state: !input vac_state
  t_room: !input vac_current_room
  t_prog: !input vac_progress
  t_rooms: !input vac_rooms_helper
  t_error: !input vac_error
  t_water: !input vac_low_water
  t_station: !input vac_station
  t_leak: !input vac_leak
  t_flag: !input problem_flag
  vac_name: "{{ device_attr(device_id(vacuum), 'name') or state_attr(vacuum, 'friendly_name') }}"
  tr: >
    {{ {
      'de': {'returning_to_wash': 'Zur Mopp-Wäsche', 'washing': 'Mopp-Wäsche', 'clean_add_water': 'Mopp-Wäsche',
             'returning': 'Zur Station', 'auto_emptying': 'Entleeren', 'charging': 'Lädt',
             'paused': '⏸ Pausiert', 'done': '✓ Fertig', 'stopped': 'Gestoppt', 'error': 'Fehler',
             'opening': '🚪 Tür öffnet', 'closing': '🚪 Tür schließt',
             'd_opening': 'Tür öffnet…', 'd_closing': 'Tür schließt…', 'd_open': 'Tür offen',
             'd_out': 'Roboter unterwegs', 'd_closed': 'Garage zu', 'd_parked': 'Roboter geparkt',
             'd_drying': 'trocknet', 'min': 'min', 'Opening': 'Öffnet', 'Open': 'Offen', 'Closing': 'Schließt',
             'Closed': 'Zu', 'problem': 'Problem', 'problems': 'Probleme', 'solved': '✅ Problem behoben',
             'leak': '🚨 Wasserleck', 'error_state': '⚠️ Fehlerzustand', 'refill': '💧 Wasser nachfüllen',
             'dust_bag': '🗑️ Staubbeutel', 'dirty_water': '🪣 Schmutzwassertank',
             'clean_water': '💧 Frischwassertank', 'detergent': '🧴 Reinigungsmittel'},
      'en': {'returning_to_wash': 'To mop wash', 'washing': 'Mop wash', 'clean_add_water': 'Mop wash',
             'returning': 'To the station', 'auto_emptying': 'Emptying', 'charging': 'Charging',
             'paused': '⏸ Paused', 'done': '✓ Done', 'stopped': 'Stopped', 'error': 'Error',
             'opening': '🚪 Door opening', 'closing': '🚪 Door closing',
             'd_opening': 'Door opening…', 'd_closing': 'Door closing…', 'd_open': 'Door open',
             'd_out': 'Robot out', 'd_closed': 'Garage closed', 'd_parked': 'robot parked',
             'd_drying': 'drying', 'min': 'min', 'Opening': 'Opening', 'Open': 'Open', 'Closing': 'Closing',
             'Closed': 'Closed', 'problem': 'Problem', 'problems': 'Problems', 'solved': '✅ Problem solved',
             'leak': '🚨 Water leak', 'error_state': '⚠️ Error state', 'refill': '💧 Refill water',
             'dust_bag': '🗑️ Dust bag', 'dirty_water': '🪣 Dirty water tank',
             'clean_water': '💧 Clean water tank', 'detergent': '🧴 Detergent'}
    }[la_lang] }}
  phase_keys: [returning_to_wash, washing, clean_add_water, returning, auto_emptying, charging]

triggers:
  - trigger: vacuum.started_returning
    target: {entity_id: !input vacuum}
    id: robot_out
  - trigger: state
    entity_id: !input vacuum
    from: docked
    not_to: [unavailable, unknown]
    id: robot_out
    note: Leaves the dock (the Dreame reports "cleaning" while it still washes its mop in the station).
  - trigger: vacuum.returned_to_dock
    target: {entity_id: !input vacuum}
    options:
      for: !input close_delay
    id: robot_docked
  - trigger: state
    entity_id: !input vacuum
    attribute: started
    to: false
    for: !input close_delay
    id: robot_docked
    note: >
      Dreame: a job that waits in the dock (mop washing, recharge before resume) keeps "started" true.
      The door closes once the job is really over. Vacuums without this attribute never fire it.
  - trigger: state
    entity_id: !input drawer
    to: "off"
    for: {seconds: 10}
    id: robot_docked
    enabled: !input respect_drawer
    note: Drawer pushed back in → close if the robot is home.
  - trigger: state
    entity_id: !input vacuum
    to: cleaning
    for: !input out_close_delay
    id: out_close
    enabled: !input close_while_out
  - trigger: state
    entity_id: !input clean_button
    to: "on"
    id: button
  - trigger: homeassistant
    event: start
    id: resync
  - trigger: state
    entity_id: !input door
    from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: resync
    note: Controller back online (reboot, Wi-Fi).
  - trigger: state
    entity_id: !input vacuum
    from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: resync
  - trigger: state
    entity_id: !input problem_sensors
    to: "on"
    id: problem
  - trigger: vacuum.errored
    target: {entity_id: !input vacuum}
    id: robot_error
  # ---- Live Activity: cleaning job ----
  - trigger: state
    entity_id: !input vac_task_status
    from: completed
    not_to: [unavailable, unknown]
    id: la_start
  - trigger: state
    entity_id: !input vac_current_room
    not_to: [unavailable, unknown]
    for: {seconds: 20}
    id: la_room
  - trigger: state
    entity_id: !input vac_progress
    not_to: [unavailable, unknown]
    id: la_progress
  - trigger: state
    entity_id: !input vac_state
    to: null
    id: la_phase
  - trigger: state
    entity_id: !input vacuum
    to: paused
    id: la_phase
  - trigger: state
    entity_id: !input vac_task_status
    to: completed
    for: {seconds: 10}
    id: la_end
  - trigger: state
    entity_id: !input vacuum
    to: error
    for: {minutes: 3}
    id: la_end
  - trigger: state
    entity_id: !input vacuum
    to: paused
    for: {minutes: 30}
    id: la_end
  # ---- Live Activity: problems ----
  - trigger: state
    entity_id: !input problem_sensors
    to: null
    id: la_problem
  - trigger: state
    entity_id: !input vac_leak
    to: null
    id: la_problem
  - trigger: state
    entity_id: !input vac_error
    to: null
    id: la_problem
  - trigger: state
    entity_id: !input vac_low_water
    to: null
    id: la_problem
  - trigger: state
    entity_id: !input vac_station
    to: null
    id: la_problem
  - trigger: state
    entity_id: !input vacuum
    to: null
    id: la_problem
  - trigger: state
    entity_id: !input door
    to: [opening, open, closing, closed]
    not_from: [unavailable, unknown]
    id: door_state
  - trigger: state
    entity_id: !input door
    to: closed
    not_from: [unavailable, unknown]
    for: {seconds: 5}
    id: dry

actions:
  - choose:
      # ---- robot out: open the door, pause the robot if the door does not open ----
      - conditions:
          - condition: trigger
            id: robot_out
        sequence:
          - action: light.turn_off
            target: {entity_id: !input button_ring}
          - if:
              - condition: state
                entity_id: !input door
                state: [closed, closing]
            then:
              - action: cover.open_cover
                target: {entity_id: !input door}
              - wait_template: "{{ is_state(door, 'open') }}"
                timeout: {seconds: "{{ open_timeout }}"}
              - if:
                  - condition: template
                    value_template: "{{ not wait.completed or is_state(motor_fault, 'on') }}"
                    note: the firmware publishes the motor fault before it stops (and the cover reads "open")
                then:
                  - action: vacuum.pause
                    target: {entity_id: !input vacuum}
                    continue_on_error: true
                  - variables:
                      message: >
                        The door did not open ({{ 'door motor fault: no current' if is_state(motor_fault, 'on')
                        else 'not open after ' ~ open_timeout ~ ' s' }}). The robot is paused.
                  - &notify
                    if:
                      - "{{ notify_targets | length > 0 }}"
                    then:
                      - action: notify.send_message
                        target: {entity_id: "{{ notify_targets }}"}
                        data: {title: "{{ notify_title }}", message: "{{ message }}"}
                    else:
                      - action: persistent_notification.create
                        data: {title: "{{ notify_title }}", message: "{{ message }}"}

      # ---- robot home (or drawer back in): close the door, retry while the beam is blocked ----
      - conditions:
          - condition: trigger
            id: robot_docked
          - condition: vacuum.is_docked
            target: {entity_id: !input vacuum}
        sequence:
          - &close_door
            sequence:
              - condition: "{{ not state_attr(vacuum, 'started') }}"
                note: job still running (washing / recharging in the dock) → keep the door open
              - action: light.turn_on
                target: {entity_id: !input button_ring}
                data: {brightness_pct: "{{ ring_brightness }}"}
              - condition: not
                conditions:
                  - condition: state
                    entity_id: !input door
                    state: [closed, closing]
              - condition: state
                entity_id: !input drawer
                state: "off"
                enabled: !input respect_drawer
              - repeat:
                  sequence:
                    - if:
                        - "{{ repeat.index > 1 }}"
                      then:
                        - wait_template: "{{ is_state(beam, 'off') }}"
                          timeout: {hours: 1}
                          continue_on_timeout: false
                        - wait_for_trigger:
                            - trigger: state
                              entity_id: !input beam
                              to: "on"
                          timeout: {seconds: "{{ retry_delay }}"}
                        - condition: "{{ not wait.trigger }}"
                          note: Beam blocked again while waiting → this attempt is skipped, the loop tries again.
                    - condition: vacuum.is_docked
                      target: {entity_id: !input vacuum}
                    - action: cover.close_cover
                      target: {entity_id: !input door}
                    - note: open = the controller re-opened the door (beam blocked or beam fault)
                      wait_for_trigger:
                        - trigger: state
                          entity_id: !input door
                          to: [closed, open]
                      timeout: {seconds: "{{ close_timeout }}"}
                  until:
                    - or:
                        - condition: state
                          entity_id: !input door
                          state: closed
                        - "{{ repeat.index >= close_tries }}"
                        - not:
                            - condition: vacuum.is_docked
                              target: {entity_id: !input vacuum}
              - if:
                  - condition: vacuum.is_docked
                    target: {entity_id: !input vacuum}
                  - not:
                      - condition: state
                        entity_id: !input door
                        state: closed
                then:
                  - variables:
                      message: >
                        The door did not close after {{ close_tries }} attempt(s)
                        (beam {{ 'blocked' if is_state(beam, 'on') else 'clear' }}). It stays open.
                  - *notify

      # ---- optional: close the garage while the robot is out cleaning ----
      - conditions:
          - condition: trigger
            id: out_close
          - condition: vacuum.is_cleaning
            target: {entity_id: !input vacuum}
          - condition: state
            entity_id: !input beam
            state: "off"
          - condition: state
            entity_id: !input door
            state: open
        sequence:
          - action: cover.close_cover
            target: {entity_id: !input door}

      # ---- clean button ----
      - conditions:
          - condition: trigger
            id: button
        sequence:
          - if:
              - condition: vacuum.is_docked
                target: {entity_id: !input vacuum}
            then:
              - condition: "{{ button_starts }}"
              - action: cover.open_cover
                target: {entity_id: !input door}
              - wait_template: "{{ is_state(door, 'open') }}"
                timeout: {seconds: "{{ open_timeout }}"}
              - if:
                  - "{{ wait.completed and not is_state(motor_fault, 'on') }}"
                then:
                  - action: vacuum.start
                    target: {entity_id: !input vacuum}
                else:
                  - variables:
                      message: >
                        Clean button: the door did not open ({{ 'door motor fault: no current'
                        if is_state(motor_fault, 'on') else 'not open after ' ~ open_timeout ~ ' s' }}),
                        the robot was not started.
                  - *notify
            else:
              - choose:
                  - conditions: "{{ button_while_out == 'return' }}"
                    sequence:
                      - action: vacuum.return_to_base
                        target: {entity_id: !input vacuum}
                  - conditions: "{{ button_while_out == 'pause' }}"
                    sequence:
                      - action: vacuum.pause
                        target: {entity_id: !input vacuum}

      # ---- after a restart: put the door where it belongs ----
      - conditions:
          - condition: trigger
            id: resync
        sequence:
          - delay: {seconds: 10}
            note: let both devices report their real state first
          - choose:
              - conditions:
                  - not:
                      - condition: vacuum.is_docked
                        target: {entity_id: !input vacuum}
                  - not:
                      - condition: state
                        entity_id: !input vacuum
                        state: [unavailable, unknown]
                  - condition: state
                    entity_id: !input door
                    state: closed
                sequence:
                  - action: light.turn_off
                    target: {entity_id: !input button_ring}
                  - action: cover.open_cover
                    target: {entity_id: !input door}
              - conditions:
                  - condition: vacuum.is_docked
                    target: {entity_id: !input vacuum}
                sequence: [*close_door]

      # ---- rear fan: drying run after parking ----
      - conditions:
          - condition: trigger
            id: dry
          - "{{ dry_speed > 0 }}"
          - condition: vacuum.is_docked
            target: {entity_id: !input vacuum}
        sequence:
          - action: fan.turn_on
            target: {entity_id: !input rear_fan}
            data: {percentage: "{{ dry_speed }}"}
            note: the firmware switches "Vent auto" off when the fan is set from HA
          - wait_for_trigger:
              - trigger: state
                entity_id: !input vacuum
                from: docked
              - trigger: state
                entity_id: !input vent_auto
                to: "on"
            timeout: {minutes: "{{ dry_minutes }}"}
          - action: switch.turn_on
            target: {entity_id: !input vent_auto}

      # ---- Live Activity: cleaning job (bar per room, phase, door) ----
      - conditions:
          - condition: trigger
            id: [la_start, la_room, la_progress, la_phase, la_end, door_state]
          - "{{ live_devices | length > 0 }}"
          - or:
              - condition: trigger
                id: la_end
              - not:
                  - condition: state
                    entity_id: !input vac_task_status
                    state: [completed, unavailable, unknown]
        sequence:
          - variables:
              tid: "{{ trigger.id }}"
              raw: "{{ '' if tid == 'la_start' else states(t_rooms) }}"
              planned: >-
                {% set rooms = (state_attr(vacuum, 'rooms') or {}).get(state_attr(vacuum, 'selected_map'), []) %}
                {% set seq = state_attr(vacuum, 'cleaning_sequence') or [] %}
                {% set act = state_attr(vacuum, 'active_segments') or [] %}
                {% set explicit = (seq if seq | count > 0 else act) | map('int') | list %}
                {% set parts = raw.split(';') if ';' in raw else ['', ''] %}
                {% set saved = parts[0].split(',') | reject('eq', '') | map('int') | list %}
                {{ explicit if explicit else (saved if saved else rooms | map(attribute='id') | map('int') | list) }}
              old_visited: >-
                {% set parts = raw.split(';') if ';' in raw else ['', ''] %}
                {{ parts[1].split(',') | reject('eq', '') | map('int') | list }}
              cur: >-
                {{ state_attr(t_room, 'room_id') | int(-1)
                   if (tid != 'la_end' and is_state(t_status, 'cleaning')) else -1 }}
              visited: >-
                {{ (old_visited + [cur])
                   if (tid in ['la_start', 'la_room'] and cur in planned and cur not in old_visited)
                   else old_visited }}
              new_raw: "{{ '' if tid == 'la_end' else (planned | join(',')) ~ ';' ~ (visited | join(',')) }}"
          - if:
              - condition: trigger
                id: la_phase
              - "{{ trigger.entity_id == t_state and tr.get(trigger.from_state.state, '') == tr.get(trigger.to_state.state, '') }}"
            then:
              - stop: phase unchanged (washing ↔ clean_add_water flicker)
          - if:
              - "{{ new_raw != states(t_rooms) }}"
            then:
              - action: input_text.set_value
                target: {entity_id: !input vac_rooms_helper}
                data: {value: "{{ new_raw }}"}
          - variables:
              p: "{{ states(t_prog) | int(0) }}"
              finished: >-
                {{ tid == 'la_end' and is_state(t_task, 'completed')
                   and (visited | select('in', planned) | list | count) >= (planned | count) }}
              room_bars: >-
                {% set n = planned | count %}
                {% set done = visited | select('in', planned) | reject('eq', cur) | list %}
                {% set rest = planned | reject('in', done) | reject('eq', cur) | list %}
                {% set seg = [1, [4, 18 // [n, 1] | max] | min] | max %}
                {% set fill = [0, [1, p * n / 100 - done | count] | min] | max %}
                {% set fills = ([1] * (planned | count)) if finished else ([1] * (done | count) + ([fill] if cur in planned else []) + [0] * (rest | count)) %}
                {% set parts = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'] %}
                {% set ns = namespace(out=[]) %}
                {% for f in fills %}{% set e = (f * seg * 8) | round(0) | int %}{% set full = e // 8 %}{% set rem = e % 8 %}{% set ns.out = ns.out + ['█' * full + parts[rem] + '░' * (seg - full - (1 if rem else 0))] %}{% endfor %}
                {{ ns.out | join(' ') }}
              label: >-
                {% set s = states(t_state) %}{% set d = states(door) %}
                {% if d in ['opening', 'closing'] %}{{ tr[d] }}
                {% elif is_state(vacuum, 'paused') %}{{ tr.paused }}
                {% elif s in phase_keys %}{{ tr[s] }}
                {% else %}{{ states(t_room) }} · {{ p }} %{% endif %}
          - choose:
              - conditions:
                  - not:
                      - condition: trigger
                        id: la_end
                sequence:
                  - variables:
                      la_tag: vacuum_progress
                      la_title: "{{ vac_name }}"
                      la_message: "{{ room_bars }}"
                      la_silent: "{{ tid != 'la_start' }}"
                      la_text: "{{ label }}"
                      la_color: "#2196F3"
                      la_icon: mdi:robot-vacuum
                      la_url: "{{ vacuum }}"
                  - &live
                    repeat:
                      for_each: "{{ live_devices }}"
                      sequence:
                        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                          continue_on_error: true
                          data:
                            title: "{{ la_title }}"
                            message: "{{ la_message | trim }}"
                            data:
                              tag: "{{ la_tag }}"
                              live_activity: true
                              live_update: true
                              silent: "{{ la_silent }}"
                              critical_text: "{{ la_text }}"
                              color: "{{ la_color }}"
                              notification_icon: "{{ la_icon }}"
                              notification_icon_color: "{{ la_color }}"
                              url: "entityId:{{ la_url }}"
                              relevance_score: "{{ la_relevance | default(0.5) }}"
            default:
              - variables:
                  err: "{{ is_state(vacuum, 'error') }}"
                  la_tag: vacuum_progress
                  la_title: "{{ vac_name }}"
                  la_message: "{{ room_bars }}"
                  la_silent: true
                  la_text: "{{ tr.error if err else (tr.done if finished else tr.stopped) }}"
                  la_color: "{{ '#F44336' if err else ('#4CAF50' if finished else '#FF9800') }}"
                  la_icon: "{{ 'mdi:robot-vacuum-alert' if err else 'mdi:robot-vacuum' }}"
                  la_url: "{{ vacuum }}"
              - *live
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input door
                    to: null
                  - trigger: state
                    entity_id: !input vac_task_status
                    to: null
                timeout: {minutes: 2}
              - condition: "{{ not wait.trigger }}"
                note: door moved or a new job started → that run owns the Live Activity now
              - &live_clear
                repeat:
                  for_each: "{{ live_devices }}"
                  sequence:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      continue_on_error: true
                      data:
                        message: clear_notification
                        data: {tag: "{{ la_tag }}"}

      # ---- Live Activity: door outside a cleaning job (same slot) ----
      - conditions:
          - condition: trigger
            id: door_state
          - "{{ live_devices | length > 0 }}"
        sequence:
          - variables:
              st: "{{ trigger.to_state.state }}"
              out: "{{ not is_state(vacuum, 'docked') }}"
              la_tag: vacuum_progress
              la_title: "{{ notify_title }}"
              la_silent: true
              la_message: >-
                {% if st == 'opening' %}{{ tr.d_opening }}
                {% elif st == 'closing' %}{{ tr.d_closing }}
                {% elif st == 'open' %}{{ tr.d_out if out else tr.d_open }}
                {% else %}{{ tr.d_closed }} · {{ tr.d_out if out else tr.d_parked }}{{
                  (' · ' ~ tr.d_drying ~ ' ' ~ dry_minutes ~ ' ' ~ tr.min) if (not out and dry_speed > 0) else '' }}{% endif %}
              la_text: "{{ tr[{'opening': 'Opening', 'open': 'Open', 'closing': 'Closing', 'closed': 'Closed'}[st]] }}"
              la_color: "{{ {'opening': '#FF9800', 'open': '#2196F3', 'closing': '#FF9800', 'closed': '#4CAF50'}[st] }}"
              la_icon: "{{ 'mdi:garage-open-variant' if st in ['opening', 'open'] else 'mdi:garage-variant' }}"
              la_url: "{{ door }}"
          - *live
          - if:
              - "{{ st == 'closed' }}"
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input door
                    to: null
                  - trigger: state
                    entity_id: !input vac_task_status
                    to: null
                timeout: {minutes: 2}
              - condition: "{{ not wait.trigger }}"
              - *live_clear

      # ---- Live Activity: every active problem (robot, station, garage) ----
      - conditions:
          - condition: trigger
            id: la_problem
          - "{{ live_devices | length > 0 }}"
        sequence:
          - variables:
              problems: >-
                {% set bad = ['unavailable', 'unknown'] %}
                {% set ns = namespace(p=[]) %}
                {% if expand(t_leak) | selectattr('state', 'eq', 'on') | list | count > 0 %}{% set ns.p = ns.p + [tr.leak] %}{% endif %}
                {% set err = states(t_error) %}
                {% if err not in bad + ['no_error'] %}{% set ns.p = ns.p + ['⚠️ ' ~ (err | replace('_', ' ') | capitalize)] %}
                {% elif is_state(vacuum, 'error') %}{% set ns.p = ns.p + [tr.error_state] %}{% endif %}
                {% if states(t_water) not in bad + ['no_warning', 'no_water_left_dismiss'] %}{% set ns.p = ns.p + [tr.refill] %}{% endif %}
                {% for e in t_station %}{% set s = states(e) %}
                  {% if s not in bad + ['installed'] %}
                    {% set key = (['dust_bag', 'dirty_water', 'clean_water', 'detergent'] | select('in', e) | list + [none]) | first %}
                    {% set ns.p = ns.p + [(tr[key] if key else state_attr(e, 'friendly_name')) ~ ': ' ~ (s | replace('_', ' '))] %}
                  {% endif %}
                {% endfor %}
                {% for e in expand(problem_sensors) | selectattr('state', 'eq', 'on') %}{% set ns.p = ns.p + ['⚠️ ' ~ e.name] %}{% endfor %}
                {{ ns.p }}
              la_tag: vacuum_error
              la_silent: true
              la_relevance: 1
              la_url: "{{ vacuum }}"
          - condition: "{{ problems | count > 0 or is_state(t_flag, 'on') }}"
          - if:
              - "{{ problems | count > 0 }}"
            then:
              - variables:
                  la_title: "{{ vac_name }} – {{ tr.problem if problems | count == 1 else problems | count ~ ' ' ~ tr.problems }}"
                  la_message: "{{ problems | join('\n') }}"
                  la_text: "{{ problems | count }} ⚠️"
                  la_color: "#F44336"
                  la_icon: mdi:robot-vacuum-alert
              - *live
              - action: input_boolean.turn_on
                target: {entity_id: !input problem_flag}
            else:
              - variables:
                  la_title: "{{ vac_name }}"
                  la_message: "{{ tr.solved }}"
                  la_text: OK
                  la_color: "#4CAF50"
                  la_icon: mdi:robot-vacuum
              - *live
              - action: input_boolean.turn_off
                target: {entity_id: !input problem_flag}
              - delay: {minutes: 1}
              - condition: state
                entity_id: !input problem_flag
                state: "off"
                note: a new problem came up meanwhile → keep its Live Activity
              - *live_clear

      # ---- messages ----
      - conditions:
          - condition: trigger
            id: problem
        sequence:
          - variables:
              message: "{{ trigger.to_state.name }} is on."
          - *notify
      - conditions:
          - condition: trigger
            id: robot_error
        sequence:
          - variables:
              message: >
                {{ state_attr(vacuum, 'friendly_name') }} reports an error{{ ': ' ~ state_attr(vacuum, 'error')
                if state_attr(vacuum, 'error') not in [none, '', 'No error'] else '' }}.
                Door: {{ states(door) }}.
          - *notify
