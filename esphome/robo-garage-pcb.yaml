# ESPHome config for the Robo-Garage controller PCB v1.3 (ESP32 DevKitC V4 plugged in)
# v1.1: SHT40 cabinet temperature / humidity (auto vent), door light barrier with self-test.
# v1.2: water leak input (LEAK clamp: electrodes or a digital sensor), buzzer, 12 V valve output (VALVE clamp),
# 12 V rail monitor on the ADC. DevKit USB-C is reachable through the case wall.
# v1.3: power headroom - DRV8874 motor driver (3 A moves, 4.9 A hardware current limit), 20 mOhm shunt,
# valve output 3 A, 12 V input 6 A. Same GPIOs and logic as v1.2, only the INA219 shunt / range changed.
# Pin changes vs. the module build: H-bridge IC instead of BTS7960 (no EN pin), INA219 on the board,
# fan tach on GPIO27, external pull-ups on reeds / button (internal pull-ups stay on, harmless).
# Light barrier: retroreflective NPN sensor (E3Z-R61 type) + reflector on the BEAM clamp: brown -> RX+,
# black -> SIG, blue -> TX- (RX-, TX+ free). The self-test switches the whole sensor off via TX-.
substitutions:
  leak_threshold: "2.2"  # V at SIG: electrodes dry = 3.3 V, tap water between them < ~2 V; a digital sensor
                         # gives 0 V or 3.3 V (see "Leak probe")
  leak_inverted: "false" # false = wet when SIG is LOW (electrodes, NPN / open-collector or active-low sensors);
                         # true = wet when SIG is HIGH (active-high push-pull sensor)
  supply_low: "10.5"     # V: below this the 12 V supply is sagging (weak PSU, stalled actuator)

esphome:
  name: robo-garage
  friendly_name: Robo-Garage
  on_boot:
    priority: -100                                             # after the HA numbers are restored
    then:
      - script.execute: apply_travel_times
      - script.execute: door_sync

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  logs:
    pulse_counter: INFO                                        # fan tach: no extra "Retrieved counter" line every 10 s
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO21          # pull-ups 4.7k on the PCB
  scl: GPIO22
  frequency: 100kHz

globals:
  - {id: at_open_limit, type: bool, restore_value: true, initial_value: "false"}    # actuator stopped itself at the
  - {id: at_closed_limit, type: bool, restore_value: true, initial_value: "false"}  # open / closed end (built-in limits)
  - {id: move_from_end, type: bool, initial_value: "false"}  # this move started at the opposite end (flag or reed)
  - {id: beam_testing, type: bool, initial_value: "false"}   # sensor is off for the self-test
  - {id: beam_dark_ok, type: bool, initial_value: "true"}    # last self-test: input read "blocked" with the sensor off
  - {id: vent_self, type: bool, initial_value: "false"}      # true while the firmware itself changes the fan

output:
  - {platform: gpio, pin: GPIO4, id: leak_drive}              # v1.2: IO4 -> R40 100k -> leak probe (pulsed)
  - {platform: ledc, pin: {number: GPIO15, ignore_strapping_warning: true}, id: buzzer_pwm, channel: 0}  # v1.2: buzzer,
                                                              # R46 pull-down. LEDC timer 0 alone (rtttl retunes it per note)
  - {platform: gpio, pin: GPIO25, id: door_open_out}          # DRV8874 IN1 -> actuator extends (on/off only, no LEDC timer)
  - {platform: gpio, pin: GPIO26, id: door_close_out}         # DRV8874 IN2 -> actuator retracts
  - {platform: ledc, pin: GPIO23, id: btn_ring_out, channel: 2}  # AO3400A -> button ring (12 V), LEDC timer 1
  - {platform: ledc, pin: GPIO17, id: fan_pwm, frequency: 25000Hz, inverted: true, channel: 4}  # 2N7002 open drain, timer 2

rtttl:
  id: buzzer
  output: buzzer_pwm

switch:
  - platform: gpio                                             # v1.3: IRLTS6342 low side -> VALVE clamp (12 V, <= 3 A)
    id: valve                                                  # on = valve powered. Use a valve that CLOSES when
    name: "Water valve"                                        # powered (normally-open solenoid / motorised valve),
    pin: {number: GPIO2, ignore_strapping_warning: true}        # then a leak powers it and the water is off. R43 pull-down.
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:valve
  - platform: template
    id: buzzer_enabled
    name: "Buzzer"                                             # off = silent (the leak alarm still beeps)
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: gpio                                             # AO3400A -> light barrier sensor 0 V (TX-, blue wire)
    id: beam_tx
    pin: GPIO13
    restore_mode: ALWAYS_ON
    internal: true
  - platform: template
    id: vent_auto
    name: "Vent auto"                                          # on = speed from the SHT41; changing "Rear fan" in HA
    optimistic: true                                           # switches this off (manual), switch on to resume
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: vent_update                            # resume right away, not after up to 30 s

select:
  - platform: template                                         # light barrier sensor type, set in HA (no reflash)
    id: beam_type
    name: "Beam type"                                          # Light-ON = sensor mode switch on L (often sold as "NC").
    options: ["Light-ON (NC)", "Dark-ON (NO)", "None"]         # Keep Light-ON with the retroreflective sensor: the
    initial_option: "Light-ON (NC)"                            # self-test switches it off, Dark-ON fails that test.
                                                               # Check: beam clear -> "Door beam" must show "Clear".
    optimistic: true                                           # None = no light barrier: always clear, no self-test,
    restore_value: true                                        # the door closes WITHOUT the safety stop.
    entity_category: config
    icon: mdi:motion-sensor
    on_value:
      - logger.log: {format: "Beam type: %s", args: ['x.c_str()']}
      - if:                                                    # re-check right away (clears the fault for None)
          condition:
            lambda: 'return id(door_ctl).current_operation == cover::COVER_OPERATION_IDLE;'
          then:
            - script.execute: beam_selftest
  - platform: template                                         # linear actuator, set in HA (no reflash)
    id: actuator_type
    name: "Actuator type"                                      # No limit switches: stops at a reed, a stall or "Open/Close time".
    options: ["No limit switches", "Built-in limit switches"]  # Built-in: it cuts its own power at each end; current
    initial_option: "No limit switches"                        # < "Motor current threshold" for 0.3 s = end reached
    optimistic: true                                           # (the reeds still work, but are optional).
    restore_value: true
    entity_category: config
    icon: mdi:arrow-expand-horizontal
    on_value:
      - lambda: 'id(at_open_limit) = false; id(at_closed_limit) = false;'
      - logger.log: {format: "Actuator type: %s", args: ['x.c_str()']}

number:
  # ---- door motor tuning (HA device page -> Configuration, no reflash) ----
  - platform: template
    id: open_time
    name: "Open time"                                          # longest the motor drives to open (stops earlier at the
    unit_of_measurement: s                                     # open reed or, built-in limit switches, when the current
    min_value: 1                                               # drops). Set to the full stroke time (+1 s for built-in
    max_value: 120                                             # limit switches). Also used for the position in HA.
    step: 0.5
    initial_value: 15
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:timer-arrow-up
    on_value:
      - script.execute: apply_travel_times
  - platform: template
    id: close_time
    name: "Close time"                                         # same for closing
    unit_of_measurement: s
    min_value: 1
    max_value: 120
    step: 0.5
    initial_value: 15
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:timer-arrow-down
    on_value:
      - script.execute: apply_travel_times
  - platform: template
    id: motor_threshold
    name: "Motor current threshold"                            # above = motor runs, below = stopped / actuator end
    unit_of_measurement: A                                     # reached. Set it between the idle and the running
    min_value: 0.005                                           # current you see in "Door motor current"
    max_value: 2                                               # (e.g. idle 0.001 A, running 0.04 A -> 0.02 A).
    step: 0.005
    initial_value: 0.02
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:current-dc
  - platform: template
    id: stall_current
    name: "Stall current"                                      # above this for 0.4 s = blocked -> stop. Set it
    unit_of_measurement: A                                     # ~0.3 A above the running current under load.
    min_value: 0.1
    max_value: 5
    step: 0.05
    initial_value: 0.8
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:car-brake-alert
  - platform: template
    id: vent_hum_on
    name: "Vent humidity limit"
    unit_of_measurement: "%"
    min_value: 40
    max_value: 90
    step: 1
    initial_value: 65
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: vent_temp_on
    name: "Vent temperature limit"
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 45
    step: 0.5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config

binary_sensor:
  - platform: template                                         # v1.2: LEAK clamp: 2 electrodes on the cabinet floor
                                                               # or a sensor with a digital output. Clamp poles: 3V3 (<= 50 mA),
                                                               # SIG (0-5 V), GND, 12V. NPN output: 10k between 3V3 and SIG.
    id: leak
    name: "Water leak"
    device_class: moisture
    lambda: |-
      if (std::isnan(id(leak_v).state)) return {};
      bool low = id(leak_v).state < ${leak_threshold};
      return ${leak_inverted} ? !low : low;
    filters: [delayed_on: 25s, delayed_off: 60s]               # 3 readings in a row (one every 10 s)
    on_press:
      - logger.log: "WATER LEAK -> valve powered, alarm"
      - switch.turn_on: valve
      - light.turn_on: {id: status_led, red: 100%, green: 0%, blue: 0%, white: 0%, effect: "Error strobe"}
      - rtttl.play: "leak:d=4,o=7,b=140:e,p,e,p,e,p,e,p,e,p,e"
    on_release:
      - light.turn_off: status_led                             # the valve stays powered until you switch it off in HA
  - platform: template                                         # v1.2: 12 V rail sagging (ADC on GPIO36)
    name: "Supply voltage low"
    device_class: problem
    lambda: return id(supply_v).state < ${supply_low};
    filters: [delayed_on: 2s, delayed_off: 5s]
  - {platform: gpio, id: door_closed_reed, name: "Door closed", pin: {number: GPIO32, mode: INPUT_PULLUP, inverted: true}}
  - {platform: gpio, id: door_open_reed, name: "Door open", pin: {number: GPIO33, mode: INPUT_PULLUP, inverted: true}}
  - platform: template                                         # end positions for the cover: reed, or (built-in limit
    id: door_open_end                                          # switches) the actuator stopped itself at that end
    internal: true
    lambda: 'return id(door_open_reed).state || (id(actuator_type).active_index().value_or(0) == 1 && id(at_open_limit));'
  - platform: template
    id: door_closed_end
    internal: true
    lambda: 'return id(door_closed_reed).state || (id(actuator_type).active_index().value_or(0) == 1 && id(at_closed_limit));'
  - {platform: gpio, id: drawer_reed, name: "Drawer", device_class: opening,
     pin: {number: GPIO18, mode: INPUT_PULLUP, inverted: false}}            # on = drawer out
  - {platform: gpio, name: "Clean button", pin: {number: GPIO19, mode: INPUT_PULLUP, inverted: true},
     filters: [delayed_on: 30ms]}
  - platform: template                                         # stall stop (INA219 on the PCB)
    id: door_stall
    name: "Door stall"
    lambda: return id(motor_current).get_raw_state() > id(stall_current).state;   # raw: before the delta filter
    filters: [delayed_on: 400ms]                               # ignores the start-up inrush
    on_press:
      - cover.stop: door_ctl
      - logger.log: "Door stall -> stopped"
  # ---- light barrier (BEAM clamp): IO34 low = SIG high = sensor output off (no light, or sensor off) ----
  - platform: gpio
    id: beam_pin                                               # on = IO34 low = sensor output off
    internal: true
    pin: {number: GPIO34, inverted: true}                      # input-only pin, pull-up R36 on the PCB
    filters: [delayed_on_off: 5ms]
  - platform: template
    id: beam_raw                                               # on = beam blocked ("Beam type" applied)
    internal: true
    lambda: |-
      const size_t type = id(beam_type).active_index().value_or(0);
      if (type == 2) return false;                             // None: no light barrier, always clear
      return type == 0 ? id(beam_pin).state : !id(beam_pin).state;   // Light-ON: output off = dark
    on_press:                                                  # unfiltered edge: beam broken while closing
      - if:
          condition:
            lambda: 'return !id(beam_testing) && id(door_ctl).current_operation == cover::COVER_OPERATION_CLOSING;'
          then:
            - logger.log: "Beam blocked while closing -> reopen"
            - cover.stop: door_ctl
            - delay: 300ms
            - cover.open: door_ctl
  - platform: template
    id: beam
    name: "Door beam"                                          # on = something in the door opening (HA display)
    device_class: occupancy
    lambda: |-
      if (id(beam_testing)) return {};                         // self-test running: keep the last state
      return id(beam_raw).state;
    filters: [delayed_off: 300ms]
  - platform: template
    id: beam_fault
    name: "Door beam fault"                                    # on = input did not read "blocked" with the sensor off
    device_class: problem
  - platform: template
    id: door_motor_fault
    name: "Door motor fault"                                   # on = driven, but current < threshold within 1.5 s
    device_class: problem                                      # (driver, J5 wiring or actuator); a good move clears it

script:
  - id: beep_move                                              # 3 short beeps (the cover waits for them to finish)
    mode: single
    then:
      - if:
          condition:
            switch.is_on: buzzer_enabled
          then:
            - rtttl.play: "move:d=16,o=7,b=200:e,p,e,p,e"
  - id: door_sync                                              # door_ctl -> HA cover: closed only at the closed end,
    then:                                                      # stopped anywhere else = open
      - cover.template.publish:
          id: door
          position: !lambda 'return id(door_ctl).position == cover::COVER_CLOSED ? cover::COVER_CLOSED : cover::COVER_OPEN;'
          current_operation: !lambda 'return id(door_ctl).current_operation;'
  - id: apply_travel_times                                     # "Open time" / "Close time" -> cover
    then:
      - lambda: |-
          const float o = id(open_time).state, c = id(close_time).state;
          if (std::isnan(o) || std::isnan(c)) return;
          id(door_ctl).set_open_duration(o * 1000);                // position estimate
          id(door_ctl).set_close_duration(c * 1000);
          id(door_ctl).set_max_duration((std::max(o, c) + 5.0f) * 1000);   // backstop; run_timer stops first
          ESP_LOGI("door", "Open time %.1f s, close time %.1f s", o, c);
  - id: run_timer                                              # stop after "Open time" / "Close time" of driving
    mode: restart
    parameters:
      seconds: float
    then:
      - delay: !lambda 'return (uint32_t) (seconds * 1000);'
      - logger.log: {format: "Run time reached (%.1f s) -> stop", args: ['seconds']}
      - cover.stop: door_ctl                                   # keep last: stop_action also stops this script
  - id: limit_watch                                            # every move: the motor must draw current;
    mode: restart                                              # built-in limit switches: current gone = end reached
    then:
      - wait_until:                                            # raw = before the delta filter
          condition:
            lambda: 'return id(motor_current).get_raw_state() > id(motor_threshold).state;'
          timeout: 1500ms
      - if:
          condition:
            lambda: 'return id(motor_current).get_raw_state() > id(motor_threshold).state;'
          then:                                                # the motor runs
            - binary_sensor.template.publish: {id: door_motor_fault, state: false}
            - if:
                condition:
                  lambda: 'return id(actuator_type).active_index().value_or(0) == 1;'
                then:
                  - wait_until:                                # below the threshold for 0.3 s (3 readings)
                      condition:
                        for:
                          time: 300ms
                          condition:
                            lambda: 'return id(motor_current).get_raw_state() < id(motor_threshold).state;'
                      timeout: 130s
                  - lambda: |-
                      if (!(id(motor_current).get_raw_state() < id(motor_threshold).state)) return;
                      if (id(door_ctl).current_operation == cover::COVER_OPERATION_OPENING) id(at_open_limit) = true;
                      if (id(door_ctl).current_operation == cover::COVER_OPERATION_CLOSING) id(at_closed_limit) = true;
                      ESP_LOGI("door", "Actuator limit switch reached (current %.3f A)", id(motor_current).get_raw_state());
          else:                                                # no current at all
            - if:
                condition:                                     # built-in limits, start position unknown, no
                  lambda: |-                                   # fault yet: the actuator may already sit at this end
                    return id(actuator_type).active_index().value_or(0) == 1 && !id(move_from_end) &&
                           !id(door_motor_fault).state;
                then:
                  - lambda: |-
                      if (id(door_ctl).current_operation == cover::COVER_OPERATION_OPENING) id(at_open_limit) = true;
                      if (id(door_ctl).current_operation == cover::COVER_OPERATION_CLOSING) id(at_closed_limit) = true;
                      ESP_LOGW("door", "No motor current (%.3f A): taken as already at this end", id(motor_current).get_raw_state());
                else:
                  - lambda: 'ESP_LOGE("door", "No motor current (%.3f A) while driving: driver, wiring or actuator fault", id(motor_current).get_raw_state());'
                  - binary_sensor.template.publish: {id: door_motor_fault, state: true}
                  - cover.stop: door_ctl                       # keep last: stop_action also stops this script
  - id: vent_update                                            # auto vent from the SHT41 (only while "Vent auto" is on)
    then:
      - if:
          condition:
            switch.is_on: vent_auto
          then:
            - lambda: |-
                id(vent_self) = true;                              // our own change: not "set by hand"
                [&]() {
                  if (id(drawer_reed).state) {                     // drawer out: no fan while you work at the station
                    if (id(rear_fan).state) id(rear_fan).turn_off().perform();
                    return;
                  }
                  const float h = id(cab_hum).state, t = id(cab_temp).state;
                  if (std::isnan(h) || std::isnan(t)) return;
                  const float h_on = id(vent_hum_on).state, t_on = id(vent_temp_on).state;
                  static bool running = false;
                  if (h > h_on || t > t_on) running = true;
                  else if (h < h_on - 5.0f && t < t_on - 1.0f) running = false;   // 5 %RH / 1 degC hysteresis
                  if (!running) {
                    if (id(rear_fan).state) id(rear_fan).turn_off().perform();
                    return;
                  }
                  // 30 % at the switch-off point, 100 % at limit + 15 %RH or + 6 degC, in 10 % steps
                  const float x = std::max((h - h_on + 5.0f) / 20.0f, (t - t_on + 1.0f) / 7.0f);
                  const float s = 30.0f + 70.0f * std::min(std::max(x, 0.0f), 1.0f);
                  const int speed = 10 * (int) roundf(s / 10.0f);
                  if (!id(rear_fan).state || id(rear_fan).speed != speed)
                    id(rear_fan).turn_on().set_speed(speed).perform();
                }();
                id(vent_self) = false;
  - id: beam_selftest                                          # sensor off -> input must read "blocked"
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(beam_type).active_index().value_or(0) == 2;'
          then:                                                # Beam type None: nothing to test, no fault
            - lambda: 'id(beam_dark_ok) = true;'
          else:
            - lambda: 'id(beam_testing) = true;'
            - switch.turn_off: beam_tx
            - wait_until:                                      # output must drop out (max 0.5 s)
                condition:
                  binary_sensor.is_on: beam_raw
                timeout: 500ms
            - lambda: 'id(beam_dark_ok) = id(beam_raw).state;'
            - switch.turn_on: beam_tx
            - wait_until:                                      # sensor powers up, sees the reflector (max 2 s)
                condition:
                  binary_sensor.is_off: beam_raw
                timeout: 2s
            - lambda: 'id(beam_testing) = false;'
      - binary_sensor.template.publish:
          id: beam_fault
          state: !lambda 'return !id(beam_dark_ok);'

sensor:
  - platform: adc                                              # v1.2: leak probe, read only while IO4 drives it
    id: leak_v
    name: "Leak probe"
    pin: GPIO35
    attenuation: 12db
    update_interval: never
    unit_of_measurement: V
    accuracy_decimals: 2
    entity_category: diagnostic
  - platform: adc                                              # v1.2: 100k / 22k divider on the 12 V rail
    id: supply_v
    name: "12 V rail"
    pin: GPIO36
    attenuation: 12db
    update_interval: 1s
    filters: [multiply: 5.545, sliding_window_moving_average: {window_size: 5, send_every: 5}, delta: 0.1]
    accuracy_decimals: 1
    unit_of_measurement: V
  - platform: ina219                                           # v1.3: on the PCB, shunt 20 mOhm (range 8 A)
    address: 0x40
    shunt_resistance: 0.02 ohm
    max_voltage: 16V
    max_current: 8A
    update_interval: 100ms
    current:                                                   # read every 100 ms for the stall stop, but only
      name: "Door motor current"                               # published (HA + log) on a change > 10 mA
      id: motor_current                                        # (the door logic uses the raw value)
      filters: [delta: 0.01]
    bus_voltage:
      name: "12 V supply"
      filters: [delta: 0.1]                                    # publish on a change > 0.1 V
  - platform: sht4x                                            # SHT41 (v1.3; SHT40 on older boards) on the island
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Cabinet temperature"
      id: cab_temp
      filters: [offset: 0.0]                                   # set after a check with a reference thermometer
    humidity:
      name: "Cabinet humidity"
      id: cab_hum
  - platform: pulse_counter                                    # fan tach, 2 pulses per turn
    pin: {number: GPIO27, mode: INPUT_PULLUP}
    name: "Rear fan speed"
    unit_of_measurement: rpm
    filters: [multiply: 0.5, delta: 50]                        # publish on a change > 50 rpm
    update_interval: 10s

fan:
  - platform: speed                                            # HA: on / off + speed slider (1-100 %)
    id: rear_fan
    output: fan_pwm
    name: "Rear fan"
    on_state:                                                  # set by hand in HA -> manual, auto vent pauses
      - if:
          condition:
            lambda: 'return !id(vent_self) && id(vent_auto).state && millis() > 15000;'   # not the boot restore
          then:
            - switch.turn_off: vent_auto
            - logger.log: "Rear fan set by hand -> Vent auto off (switch it on again to resume)"

interval:
  - interval: 10s                                              # v1.2: leak probe, 70 ms of 3.3 V every 10 s (no corrosion)
    then:
      - output.turn_on: leak_drive
      - delay: 50ms
      - component.update: leak_v
      - delay: 20ms
      - output.turn_off: leak_drive
  - interval: 30s                                              # auto vent from the SHT41
    then:
      - script.execute: vent_update
  - interval: 10min                                            # beam self-test while the door is idle
    then:
      - if:
          condition:
            lambda: 'return id(door_ctl).current_operation == cover::COVER_OPERATION_IDLE;'
          then:
            - script.execute: beam_selftest

cover:
  - platform: template                                         # what HA shows: open / closed / opening / closing,
    id: door                                                   # no position percentage (mirrors door_ctl)
    name: "Robo-Garage Door"
    device_class: damper
    has_position: false
    restore_mode: NO_RESTORE                                   # state comes from door_ctl (door_sync)
    open_action:
      - cover.open: door_ctl
    close_action:
      - cover.close: door_ctl
    stop_action:
      - cover.stop: door_ctl
  - platform: endstop                                          # the actual drive (internal): reeds / limit switches,
    id: door_ctl                                               # run times, position estimate
    name: "Door drive"
    internal: true
    on_opening: [script.execute: door_sync]
    on_closing: [script.execute: door_sync]
    on_idle: [script.execute: door_sync]
    open_action:
      - output.turn_off: door_close_out
      - script.execute: beep_move
      - delay: 200ms                                           # coast before a reversal (open while closing)
      - wait_until:                                            # the 3 beeps sound BEFORE the door moves (~0.4 s)
          condition:
            lambda: 'return !id(buzzer).is_playing();'
          timeout: 1s
      - lambda: |-
          id(move_from_end) = id(at_closed_limit) || id(door_closed_reed).state;   // started at the closed end?
          id(at_closed_limit) = false;                                             // leaving the closed end
      - output.turn_on: door_open_out
      - script.execute: limit_watch
      - script.execute: {id: run_timer, seconds: !lambda 'return id(open_time).state;'}
    open_endstop: door_open_end
    open_duration: 15s                                         # start values, replaced at boot by "Open time" / "Close time"
    close_action:
      - output.turn_off: door_open_out
      - script.execute: beep_move
      - script.execute: beam_selftest                          # 0.1-2.5 s before every close
      - delay: 200ms                                           # coast before a reversal (close while opening)
      - script.wait: beam_selftest
      - wait_until:                                            # the 3 beeps sound BEFORE the door moves
          condition:
            lambda: 'return !id(buzzer).is_playing();'
          timeout: 1s
      - if:
          condition:
            lambda: 'return id(beam_dark_ok) && !id(beam_raw).state;'   # sensor works and beam is clear
          then:
            - lambda: |-
                id(move_from_end) = id(at_open_limit) || id(door_open_reed).state;   // started at the open end?
                id(at_open_limit) = false;                                           // leaving the open end
            - output.turn_on: door_close_out
            - script.execute: limit_watch
            - script.execute: {id: run_timer, seconds: !lambda 'return id(close_time).state;'}
          else:
            - logger.log: "Door stays open: beam blocked or beam fault"
            - cover.open: door_ctl                             # back to fully open (no-op if already open)
    close_endstop: door_closed_end
    close_duration: 15s
    max_duration: 20s
    stop_action:
      - script.stop: limit_watch
      - script.stop: run_timer
      - output.turn_off: door_open_out
      - output.turn_off: door_close_out

light:
  - {platform: monochromatic, name: "Clean button ring", output: btn_ring_out}
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Robo-Garage Status LED"
    pin: GPIO16                                                # via 74AHCT1G125 level shifter
    # Line: SK6812 RGBW 144 LEDs/m, natural white (RGBNW), one 50 cm segment = 72 LEDs.
    # Dot / Ring 12 / Underglow (WS2812B): num_leds 1 / 12 / 16, chipset WS2812, channel_colors GRB, no color_correct.
    num_leds: 72
    chipset: SK6812
    channel_colors: GRBW
    color_correct: [25%, 25%, 25%, 25%]                        # <= 1.44 A at full RGBW: the LED clamp gives 1.5 A (F2)
    effects:
      - pulse: {name: "Slow pulse", transition_length: 1s, update_interval: 1s}
      - strobe: {name: "Error strobe"}
      - addressable_scan: {name: "Chase"}
      - addressable_color_wipe: {name: "Spinner"}

# Optional VL53L1X (robot in bay) on the I2C clamp: needs an external ESPHome component.
